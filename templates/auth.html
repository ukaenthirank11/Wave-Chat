{% extends "base.html" %}
{% block content %}
<main class="auth-shell auth-onboarding">
    <section class="auth-onboarding-card" aria-label="WaveChat onboarding">
        <div class="auth-step active" data-step="phone">
            <div class="auth-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.7 15.7 0 0 0 6.6 6.6l2.2-2.2c.3-.3.8-.4 1.2-.3 1 .3 2 .5 3 .5.7 0 1.2.5 1.2 1.2V20c0 .7-.5 1.2-1.2 1.2C10.3 21.2 2.8 13.7 2.8 4.4 2.8 3.7 3.3 3.2 4 3.2h3.2c.7 0 1.2.5 1.2 1.2 0 1 .2 2 .5 3 .1.4 0 .9-.3 1.2l-2 2.2z" fill="currentColor"/></svg>
            </div>
            <div class="auth-step-copy">
                <h1>Enter your phone number</h1>
                <p>Continue to your chats with your phone number</p>
            </div>

            <div class="auth-field-stack">
                <button type="button" class="country-select" id="country-select-btn">
                    <span class="flag" id="country-flag">&#127482;&#127480;</span>
                    <span class="country-info">
                        <strong id="country-name">United States</strong>
                        <span id="country-dial">+1</span>
                    </span>
                    <span class="country-caret">&#9662;</span>
                </button>

                <div class="phone-input-wrap" id="phone-input-wrap">
                    <span class="flag" id="phone-flag">&#127482;&#127480;</span>
                    <span class="dial" id="phone-dial">+1</span>
                    <input id="phone-number" name="phoneNumber" type="tel" placeholder="Phone number" inputmode="numeric" autocomplete="off">
                </div>
                <div class="phone-hint" id="phone-hint"></div>
            </div>

            <button type="button" class="primary-btn auth-primary" id="phone-login-btn">Continue</button>
        </div>

        <div class="auth-step" data-step="name">
            <div class="auth-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12.6a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm0 2c-3.2 0-7 1.7-7 4v1.6h14V18.6c0-2.3-3.8-4-7-4z" fill="currentColor"/></svg>
            </div>
            <div class="auth-step-copy">
                <h1>Enter your name</h1>
                <p>This name appears in chats and keeps your profile clear</p>
            </div>
            <div class="auth-field-stack">
                <input class="auth-text-input" id="display-name" name="displayName" type="text" placeholder="Your name" autocomplete="name" maxlength="80">
                <div class="phone-hint" id="name-hint"></div>
                <button type="button" class="country-select" id="selected-country-summary">
                    <span class="flag" id="summary-country-flag">&#127482;&#127480;</span>
                    <span class="country-info">
                        <strong id="summary-country-name">United States</strong>
                        <span id="summary-country-timezone">America/New_York</span>
                    </span>
                </button>
            </div>
            <button type="button" class="primary-btn auth-primary" id="name-login-btn" disabled>Continue</button>
        </div>

        <div class="auth-status hidden" id="auth-status"></div>
    </section>

    <div class="country-sheet hidden" id="country-sheet" aria-hidden="true">
        <div class="country-sheet-card">
            <div class="country-sheet-header">
                <h2>Select Country</h2>
                <button type="button" class="sheet-close" id="country-close-btn" aria-label="Close">&times;</button>
            </div>
            <div class="country-search">
                <input type="text" id="country-search" placeholder="Search country or code...">
            </div>
            <div class="country-list" id="country-list">
                <button type="button" class="country-option active" data-code="US" data-name="United States" data-dial="+1" data-flag="🇺🇸" data-length="10" data-time-zone="America/New_York">
                    <span class="flag">&#127482;&#127480;</span>
                    <span class="country-copy">
                        <strong>United States</strong>
                        <span>+1</span>
                    </span>
                    <span class="country-check">&#10003;</span>
                </button>
                <button type="button" class="country-option" data-code="GB" data-name="United Kingdom" data-dial="+44" data-flag="🇬🇧" data-length="10" data-time-zone="Europe/London">
                    <span class="flag">&#127468;&#127463;</span>
                    <span class="country-copy">
                        <strong>United Kingdom</strong>
                        <span>+44</span>
                    </span>
                </button>
                <button type="button" class="country-option" data-code="IN" data-name="India" data-dial="+91" data-flag="🇮🇳" data-length="10" data-time-zone="Asia/Kolkata">
                    <span class="flag">&#127470;&#127475;</span>
                    <span class="country-copy">
                        <strong>India</strong>
                        <span>+91</span>
                    </span>
                </button>
                <button type="button" class="country-option" data-code="CA" data-name="Canada" data-dial="+1" data-flag="🇨🇦" data-length="10" data-time-zone="America/Toronto">
                    <span class="flag">&#127464;&#127462;</span>
                    <span class="country-copy">
                        <strong>Canada</strong>
                        <span>+1</span>
                    </span>
                </button>
                <button type="button" class="country-option" data-code="AU" data-name="Australia" data-dial="+61" data-flag="🇦🇺" data-length="9" data-time-zone="Australia/Sydney">
                    <span class="flag">&#127462;&#127482;</span>
                    <span class="country-copy">
                        <strong>Australia</strong>
                        <span>+61</span>
                    </span>
                </button>
                <button type="button" class="country-option" data-code="DE" data-name="Germany" data-dial="+49" data-flag="🇩🇪" data-length="10" data-time-zone="Europe/Berlin">
                    <span class="flag">&#127465;&#127466;</span>
                    <span class="country-copy">
                        <strong>Germany</strong>
                        <span>+49</span>
                    </span>
                </button>
            </div>
        </div>
    </div>
</main>
<script type="module" src="{{ url_for('static', filename='js/auth.js', v=asset_version) }}"></script>
{% endblock %}
